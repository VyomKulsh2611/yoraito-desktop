<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>Yoraito</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center; flex-direction: column;
         font-family: "Segoe UI", system-ui, sans-serif; background: #f6f7fb; color: #1f2a44; }
  .logo { width: 72px; height: 72px; border-radius: 16px; background: #4361ee; color: #fff; font-size: 44px;
          font-weight: 700; display: flex; align-items: center; justify-content: center; margin-bottom: 18px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { margin: 0; color: #5b6784; font-size: 14px; }
  .bar { width: 180px; height: 4px; background: #dfe3ef; border-radius: 2px; margin-top: 22px; overflow: hidden; }
  .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #4361ee; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
</style>
</head>
<body>
  <div class="logo">Y</div>
  <h1>Starting Yoraito...</h1>
  <p>Your files stay on this computer.</p>
  <div class="bar"></div>
</body>
</html>
